name: iOS build and tests
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Core and timer tests
        run: |
          swift test --package-path ios/ExposureCore
          swift test --package-path ios/TimerSupport
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Select iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Build and run simulator UI tests
        run: |
          set -o pipefail
          xcodebuild test -project ios/ExposureAssistant.xcodeproj -scheme ExposureAssistant -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/ios -resultBundlePath build/ios-tests.xcresult CODE_SIGNING_ALLOWED=NO | tee build-ios.log
      - name: Export test screenshot to log (no artifact storage)
        if: always()
        run: |
          if [ -d build/ios-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ios-tests.xcresult --output-path /tmp/ios-attachments || true
            python3 - <<'PYCODE'
          import pathlib, subprocess, base64
          images = sorted(pathlib.Path('/tmp/ios-attachments').rglob('*.png'))
          for i, path in enumerate(images[:8]):
              out = f'/tmp/ios-shot-{i}.png'
              subprocess.run(['sips', '-Z', '720', str(path), '--out', out], check=True, stdout=subprocess.DEVNULL)
              data = base64.b64encode(pathlib.Path(out).read_bytes()).decode()
              print(f'SCREENSHOT_BEGIN {i}')
              for start in range(0, len(data), 1000): print(data[start:start+1000])
              print(f'SCREENSHOT_END {i}')
          PYCODE
      - name: Unsigned physical-device build
        run: xcodebuild build -project ios/ExposureAssistant.xcodeproj -scheme ExposureAssistant -destination 'generic/platform=iOS' -configuration Release -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO
  android-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android build and unit regression
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
