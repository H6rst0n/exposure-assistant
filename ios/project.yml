name: ExposureAssistant
options:
  bundleIdPrefix: tw.exposure
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  ExposureCore:
    path: ExposureCore
  TimerSupport:
    path: TimerSupport
targets:
  ExposureAssistant:
    type: application
    platform: iOS
    sources: [ExposureAssistant]
    dependencies:
      - package: ExposureCore
      - package: TimerSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.exposure.assistant.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 曝光助手
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
  ExposureAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ExposureAssistantTests]
    dependencies:
      - target: ExposureAssistant
      - package: TimerSupport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ExposureAssistantUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ExposureAssistantUITests]
    dependencies:
      - target: ExposureAssistant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ExposureAssistant:
    build:
      targets:
        ExposureAssistant: all
    test:
      targets: [ExposureAssistantTests, ExposureAssistantUITests]
